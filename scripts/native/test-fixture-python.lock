# Exact-pinned independent test-fixture cryptography toolchain for the hosted native CI.
# Scope: Python test fixture generators only (native/tests/foundation/make_fixtures.py,
# native/tests/transport/socket_fixture.py, native/tests/community/socket_fixture.py).
# This is NOT a product runtime dependency: the product CMake graph never reads this file and
# the pinned static OpenSSL 3.5.9 supply chain is completely separate.
# The install is fail-closed: --require-hashes refuses any artifact whose SHA256 is not pinned
# below, --only-binary=:all: refuses source distributions, --no-deps refuses transitive drift,
# and the ==version pins leave pip no resolution freedom. scripts/native/test-fixture-python-verify.py
# must run right after this install and before any CMake configure.
# Runners: windows-2025-vs2026 (CPython 3.13.18 win_amd64) and ubuntu-24.04 (CPython 3.13.18
# x86_64, glibc 2.39). Both legs enable -DNICKEL_BUILD_TESTS=ON and both generate the foundation
# fixtures through add_custom_command, so both need this toolchain.
# cryptography 48.0.1 ships cp311-abi3 stable-ABI wheels: the exact same release serves CPython
# 3.13 on both runners. Its only CPython dependency (cffi>=2.0.0) and cffi's own pycparser
# dependency are pinned here because the install runs with --no-deps.
# Hash evidence: official PyPI JSON API https://pypi.org/pypi/<name>/<version>/json.
