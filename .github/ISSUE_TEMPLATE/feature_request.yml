name: 功能建议
description: 分享一个具体的使用场景和改进想法
title: "[Feature] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你正在完成什么任务？现有操作在哪里不顺手？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的操作
      description: 描述入口、操作流程和最终结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他做法
      description: 已尝试的方法、参考图片或相关链接。
